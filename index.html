<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MT Interactive Platform</title>
  <meta name="description" content="Secure access notice and anti-fraud reminder." />
  <meta name="format-detection" content="telephone=no" />

  <style>
    :root { color-scheme: dark; }
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: radial-gradient(circle at top, #3b0000 0%, #000000 55%, #000000 100%);
      color:#FF0000;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      overflow-x: hidden;
    }

    /* 背景流光 */
    body::before {
      content:'';
      position:fixed;
      inset:-40%;
      background:
        radial-gradient(circle at 15% 0%, rgba(255,0,0,0.24) 0, transparent 55%),
        radial-gradient(circle at 85% 100%, rgba(212,175,55,0.18) 0, transparent 55%);
      opacity:0.9;
      z-index:-2;
      animation:bgFloat 18s linear infinite alternate;
    }
    @keyframes bgFloat {
      0%   { transform:translate3d(0,0,0) scale(1); }
      50%  { transform:translate3d(0,10px,0) scale(1.03); }
      100% { transform:translate3d(0,-10px,0) scale(1.02); }
    }

    .page {
      width: 100%;
      max-width: 520px;
    }

    .card {
      width:100%;
      padding:22px 18px 22px;
      border-radius:22px;
      background: radial-gradient(circle at top, #232323 0%, #050404 55%, #050404 100%);
      border:1px solid #ff1c1c;
      box-shadow:
        0 0 0 1px rgba(255,0,0,0.25),
        0 0 32px rgba(255,0,0,0.55),
        0 18px 40px rgba(0,0,0,0.9);
      position:relative;
      overflow:hidden;
    }

    /* 卡片內部紅色光暈邊線 */
    .card::before {
      content:'';
      position:absolute;
      inset:0;
      border-radius:22px;
      border:1px solid rgba(255,0,0,0.5);
      box-shadow:
        0 0 18px rgba(255,0,0,0.8),
        0 0 30px rgba(0,0,0,0.9);
      opacity:0.45;
      pointer-events:none;
    }

    /* 上方安全提醒條 */
    .notice-bar {
      position:relative;
      z-index:1;
      margin:-6px auto 12px;
      padding:6px 12px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      background:linear-gradient(90deg,#3b2a00,#d4af37,#3b2a00);
      box-shadow:0 0 18px rgba(212,175,55,0.75);
      color:#1b0f00;
      font-size:12px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:0.11em;
    }
    .notice-dot {
      width:7px;
      height:7px;
      border-radius:999px;
      background:#ff3b3b;
      box-shadow:0 0 8px rgba(255,59,59,0.9);
      animation:pulseDot 1.4s ease-in-out infinite;
    }
    @keyframes pulseDot {
      0%,100% { transform:scale(1); opacity:1; }
      50% { transform:scale(1.4); opacity:0.6; }
    }

    /* Logo 外框金邊 */
    .logo-frame {
      position:relative;
      z-index:1;
      margin:4px auto 14px;
      padding:10px 14px;
      border-radius:18px;
      background: radial-gradient(circle at top, #3b2b10 0, #050404 60%);
      border:1px solid rgba(212,175,55,0.85);
      box-shadow:
        0 0 22px rgba(212,175,55,0.9),
        0 12px 26px rgba(0,0,0,0.9);
    }
    .logo-frame::before {
      content:'';
      position:absolute;
      inset:-1px;
      border-radius:inherit;
      border:1px solid rgba(255,255,255,0.05);
      pointer-events:none;
    }

    .logo {
      display:block;
      margin:0 auto;
      width:72%;
      max-width:260px;
      height:auto;
    }

    h1 {
      position:relative;
      z-index:1;
      font-size:18px;
      margin:10px 0 6px;
      color:#ff2d2d;
      font-weight:800;
      line-height:1.35;
      text-shadow:0 0 6px rgba(0,0,0,0.9);
    }
    p {
      position:relative;
      z-index:1;
      margin:4px 0;
      color:#f1f1f1;
      font-size:14px;
      line-height:1.5;
    }
    .sub {
      position:relative;
      z-index:1;
      margin-top:6px;
      font-size:12px;
      color:#c7c7c7;
      line-height:1.4;
    }

    /* 底下紅色光暈 */
    .card-glow {
      position:absolute;
      left:50%;
      bottom:-40px;
      width:160%;
      max-width:720px;
      height:120px;
      background:radial-gradient(ellipse at center, rgba(255,0,0,0.35) 0, transparent 65%);
      transform:translateX(-50%);
      z-index:0;
      pointer-events:none;
    }

    /* 黑金按鈕 */
    .btn-enter {
      position:relative;
      z-index:1;
      margin-top:20px;
      display:block;
      width:100%;
      padding:13px 0;
      background:#050505;
      border-radius:999px;
      border:1px solid #d4af37;
      color:#ffd97a;
      font-size:15px;
      font-weight:700;
      text-decoration:none;
      letter-spacing:0.1em;
      text-transform:uppercase;
      box-shadow:
        0 0 16px rgba(212,175,55,0.6),
        0 10px 22px rgba(0,0,0,0.95);
      transition:
        background 0.18s ease,
        box-shadow 0.18s ease,
        transform 0.15s ease;
    }
    .btn-enter:hover {
      background:#111111;
      box-shadow:
        0 0 22px rgba(255,215,128,0.9),
        0 12px 26px rgba(0,0,0,1);
      transform:translateY(-1px);
    }
    .btn-enter:active {
      transform:translateY(0);
      box-shadow:
        0 0 14px rgba(212,175,55,0.7),
        0 8px 18px rgba(0,0,0,1);
    }

    /* 小螢幕微調 */
    @media (max-width: 360px) {
      .card {
        padding:18px 14px 18px;
      }
      h1 {
        font-size:16px;
      }
      p {
        font-size:13px;
      }
      .btn-enter {
        font-size:14px;
        padding:12px 0;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="card-glow"></div>

      <div class="notice-bar">
        <span class="notice-dot"></span>
        <span id="t-bar">安全提醒</span>
      </div>

      <div class="logo-frame">
        <img class="logo" src="./ofa168-logo-300.png" alt="Logo">
      </div>

      <h1 id="t-title">請勿相信任何代操、代儲、穩贏等訊息，皆為詐騙。</h1>
      <p id="t-desc">請妥善保管帳號密碼，以免造成損失。</p>
      <div id="t-sub" class="sub">平台不會主動向您索取密碼或進行任何代操作業。</div>

      <a id="enterBtn" class="btn-enter" href="#">進入官網</a>
    </section>
  </main>

        h1: '請勿相信任何代操、代儲、穩贏等訊息，全部都係詐騙。',
        p:  '請妥善保管帳號同密碼，以免造成損失。',
        sub:'平台唔會主動向你索取密碼，亦唔會代你操作帳號。',
        btn:'進入官網',
        alt:'標誌'
      },
      'km': {
        htmlLang: 'km',
        titleTag: 'វេទិកាអន្តរកម្ម MT - ការព្រមានសុវត្ថិភាព',
        metaDesc: 'សូមកុំជឿលើសារអំពីលេងជំនួស ដាក់ប្រាក់ជំនួស ឬធានាឈ្នះ—ទាំងអស់គឺជាការលួចបោក។',
        bar: 'ការព្រមានសុវត្ថិភាព',
        h1:'សូមកុំជឿលើសារណាមួយអំពីសេវាកម្មលេងជំនួស ដាក់ប្រាក់ជំនួស ឬការធានាឈ្នះ—ទាំងអស់ជាការលួចបោក។',

        sub:'แพลตฟอร์มจะไม่ขอรหัสผ่านหรือดำเนินการใด ๆ แทนคุณ',
        btn:'เข้าสู่เว็บไซต์',

      },
      'ms': {
        htmlLang: 'ms',
        titleTag: 'Platform MT - Peringatan Keselamatan',
        metaDesc: 'Jangan percayai tawaran khidmat main akaun, tambah nilai bagi pihak anda atau janji menang — semuanya adalah penipuan.',
        bar: 'Peringatan Keselamatan',
        h1:'Jangan percayai tawaran khidmat main akaun, tambah nilai bagi pihak anda atau janji menang — semuanya adalah penipuan.',

        btn:'Masuk Laman Rasmi',
        alt:'Logo'
      }
    };

    function pickLocale() {
      const prefs = (navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || 'en']
      ).map(l => (l || '').toLowerCase());

      for (const lang of prefs) {
        if (lang.startsWith('zh-hk') || lang.startsWith('zh-mo') || lang.includes('yue')) return 'yue';
        if (lang.startsWith('zh-tw') || lang.includes('hant')) return 'zh-Hant';
        if (lang.startsWith('zh-cn') || lang.startsWith('zh-sg') || lang.includes('hans')) return 'zh-Hans';
        if (lang.startsWith('km')) return 'km';
        if (lang.startsWith('vi')) return 'vi';
        if (lang.startsWith('th')) return 'th';
        if (lang.startsWith('ms')) return 'ms';
        if (lang.startsWith('en')) return 'en';
      }
      return 'en';
    }

    function applyI18n(dict) {
      document.documentElement.lang = dict.htmlLang || 'en';
      document.title = dict.titleTag || document.title;

      const meta = document.querySelector('meta[name="description"]');
      if (meta && dict.metaDesc) meta.content = dict.metaDesc;

      const bar = document.getElementById('t-bar');
      const h1  = document.getElementById('t-title');
      const p   = document.getElementById('t-desc');
      const sub = document.getElementById('t-sub');
      const btn = document.getElementById('enterBtn');
      const logo= document.querySelector('.logo');

      if (bar) bar.textContent = dict.bar;
      if (h1)  h1.textContent  = dict.h1;
      if (p)   p.textContent   = dict.p;
      if (sub) sub.textContent = dict.sub;
      if (btn) btn.textContent = dict.btn;
      if (logo)logo.alt        = dict.alt;

      const extra = window.location.search.replace(/^\?/, '');
      const sep = OFFICIAL_URL.includes('?') ? '&' : '?';
      const target = extra ? (OFFICIAL_URL + sep + extra) : OFFICIAL_URL;
      if (btn) btn.href = target;
    }

    const locale = pickLocale();
    applyI18n(I18N[locale] || I18N.en);
  </script>
</body>
</html>
